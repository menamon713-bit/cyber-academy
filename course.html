<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الكورسات | Cyber Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #08090d; color: white; margin: 0; padding: 0; }
        .header { background: #15161d; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #282a34; }
        .header h1 { margin: 0; color: #ff304b; font-size: 24px; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .page-title { text-align: center; margin-bottom: 30px; }
        .page-title h2 { font-size: 32px; margin-bottom: 10px; }
        .page-title p { color: #9a9ba8; }
        .search-box { width: 100%; padding: 15px; background: #15161d; border: 1px solid #282a34; border-radius: 12px; color: white; font-family: inherit; font-size: 16px; margin-bottom: 30px; box-sizing: border-box; }
        .search-box:focus { outline: none; border-color: #ff304b; }
        
        /* شبكة الكورسات */
        .courses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .course-card { background: #15161d; border: 1px solid #282a34; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; transition: 0.3s; }
        .course-card:hover { border-color: #ff304b; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(255,48,75,0.1); }
        .course-card h3 { color: #ff304b; margin-top: 0; margin-bottom: 10px; }
        .course-card p { color: #9a9ba8; font-size: 14px; margin-bottom: 20px; line-height: 1.6; flex-grow: 1; }
        .course-meta { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .level-badge { background: #282a34; color: #fff; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .start-btn { background: #ff304b; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit; transition: 0.2s; }
        .start-btn:hover { background: #b90e2a; }
        .loading { text-align: center; color: #9a9ba8; font-size: 18px; margin-top: 50px; grid-column: 1/-1; }
    </style>
</head>
<body>

    <!-- الهيدر بتاع الموقع -->
    <div class="header">
        <h1>_CyberAcademy</h1>
        <a href="/index.html" style="color: #fff; text-decoration: none;">الرئيسية</a>
    </div>

    <div class="container">
        <div class="page-title">
            <h2>مكتبة الكورسات</h2>
            <p>ابحث في موضوعات الأمن السيبراني المتاحة</p>
        </div>

        <!-- شريط البحث -->
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن كورس...">

        <!-- هنا هيتم عرض الكورسات -->
        <div class="courses-grid" id="coursesContainer">
            <p class="loading">جاري تحميل الكورسات...</p>
        </div>
    </div>

    <script src="course.js"></script>
</body>
</html>
