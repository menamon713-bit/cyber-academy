<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الكورسات | Cyber Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #08090d; color: white; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { color: #ff304b; }
        .courses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1000px; margin: auto; }
        .course-card { background: #15161d; border: 1px solid #282a34; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
        .course-card:hover { border-color: #ff304b; transform: translateY(-5px); }
        .course-card h3 { color: #ff304b; margin-top: 0; margin-bottom: 10px; }
        .course-card p { color: #9a9ba8; font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
        .course-meta { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .level-badge { background: #282a34; color: #fff; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .start-btn { background: #ff304b; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit; }
        .start-btn:hover { background: #b90e2a; }
        .loading { text-align: center; color: #9a9ba8; font-size: 18px; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚀 مسارات التعلم</h1>
        <p style="color: #9a9ba8;">اختر الكورس المناسب وابدأ رحلة الأمن السيبراني</p>
    </div>

    <!-- هنا هيتم إضافة الكورسات أوتوماتيك -->
    <div class="courses-grid" id="coursesContainer">
        <p class="loading">جاري تحميل الكورسات...</p>
    </div>

    <script src="course.js"></script>
</body>
</html>
