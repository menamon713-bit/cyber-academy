<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>لوحة تحكم المدير | Cyber Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #08090d; color: white; padding: 20px; margin: 0;}
        .container { max-width: 800px; margin: auto; background: #15161d; padding: 25px; border-radius: 15px; border: 1px solid #282a34; }
        h1 { color: #ff304b; text-align: center; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #101116; border: 1px solid #282a34; color: white; border-radius: 8px; font-family: inherit; box-sizing: border-box;}
        .primary-btn { background: #ff304b; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-top: 10px;}
        .course-item { background: #101116; border: 1px solid #282a34; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;}
        .action-btns { display: flex; gap: 5px; }
        .edit-btn { background: #007bff; color: white; border: none; padding: 5px 15px; border-radius: 8px; cursor: pointer;}
        .delete-btn { background: #555; color: white; border: none; padding: 5px 15px; border-radius: 8px; cursor: pointer;}
        .stats-box { background: #101116; border: 1px solid #282a34; padding: 20px; border-radius: 12px; text-align: center; }
        .stats-box h2 { margin: 0; font-size: 36px; }
        .user-list { max-height: 200px; overflow-y: auto; text-align: right; margin-top: 15px; background: #101116; border: 1px solid #282a34; border-radius: 12px; padding: 15px;}
        .user-list div { padding: 8px; border-bottom: 1px solid #282a34; font-size: 13px; color: #ccc; }
    </style>
</head>
<body>
    <div class="container" id="adminContent" style="display: none;">
        <h1>لوحة تحكم المدير</h1>
        
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px;">
            <div class="stats-box">
                <h2 id="totalUsersCount" style="color: #45d483;">0</h2>
                <p>إجمالي الطلاب</p>
            </div>
            <div class="stats-box">
                <h2 id="totalCoursesCount" style="color: #3b82f6;">0</h2>
                <p>إجمالي الكورسات</p>
            </div>
            <div class="stats-box">
                <h2 id="totalCompletedCount" style="color: #a855f7;">0</h2>
                <p>دروس مكتملة</p>
            </div>
        </div>
        <div class="user-list" id="userListContainer"></div>
        
        <h3 id="formTitle" style="margin-top: 30px;">إضافة كورس جديد</h3>
        <input type="hidden" id="editCourseId" value="">
        <input type="text" id="courseTitle" placeholder="اسم الكورس">
        <textarea id="courseDesc" placeholder="وصف الكورس" rows="3"></textarea>
        <select id="courseLevel">
            <option value="مبتدئ">مبتدئ</option>
            <option value="متوسط">متوسط</option>
            <option value="متقدم">متقدم</option>
        </select>
        <button class="primary-btn" id="addCourseBtn">إضافة الكورس للموقع</button>
        <button class="primary-btn" id="cancelEditBtn" style="display:none; background:#555; margin-top:5px;">إلغاء التعديل</button>

        <hr style="border-color: #282a34; margin: 30px 0;">
        <h3>الكورسات المضافة حالياً</h3>
        <div id="courseList"></div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
