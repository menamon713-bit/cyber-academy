<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>لوحة المدير | Cyber Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #08090d; color: white; padding: 20px; margin: 0;}
        .container { max-width: 800px; margin: auto; background: #15161d; padding: 25px; border-radius: 15px; border: 1px solid #282a34; }
        h1 { color: #ff304b; text-align: center; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #101116; border: 1px solid #282a34; color: white; border-radius: 8px; box-sizing: border-box;}
        .primary-btn { background: #ff304b; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold;}
        .course-item { background: #101116; border: 1px solid #282a34; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;}
        .delete-btn { background: #555; color: white; border: none; padding: 5px 15px; border-radius: 8px; cursor: pointer;}
        .stats-box { background: #101116; border: 1px solid #282a34; padding: 20px; border-radius: 12px; text-align: center; }
        .user-list { max-height: 200px; overflow-y: auto; margin-top: 15px; background: #101116; border-radius: 12px; padding: 15px;}
        .logout-btn { background: #282a34; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; float: left; }
    </style>
</head>
<body>
    <div class="container" id="adminContent" style="display: none;">
        <button class="logout-btn" onclick="logout()">خروج</button>
        <h1>لوحة تحكم المدير</h1>
        
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px;">
            <div class="stats-box"><h2 id="totalUsersCount">0</h2><p>الطلاب</p></div>
            <div class="stats-box"><h2 id="totalCoursesCount">0</h2><p>الكورسات</p></div>
        </div>
        <div class="user-list" id="userListContainer"></div>
        
        <h3 style="margin-top: 30px;">إضافة كورس جديد</h3>
        <input type="text" id="courseTitle" placeholder="اسم الكورس">
        <textarea id="courseDesc" placeholder="وصف الكورس" rows="3"></textarea>
        <select id="courseLevel"><option value="مبتدئ">مبتدئ</option><option value="متوسط">متوسط</option><option value="متقدم">متقدم</option></select>
        <button class="primary-btn" id="addCourseBtn">إضافة الكورس</button>
        
        <hr style="border-color: #282a34; margin: 30px 0;">
        <h3>الكورسات الحالية</h3>
        <div id="courseList"></div>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
