<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>لوحة تحكم المدير | Cyber Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #08090d; color: white; padding: 20px; margin: 0;}
        .container { max-width: 800px; margin: auto; background: #15161d; padding: 25px; border-radius: 15px; border: 1px solid #282a34; display: none; }
        h1 { color: #ff304b; text-align: center; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #101116; border: 1px solid #282a34; color: white; border-radius: 8px; font-family: inherit; box-sizing: border-box;}
        button { background: #ff304b; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-top: 10px;}
        button:hover { background: #b90e2a; }
        .course-item { background: #101116; border: 1px solid #282a34; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;}
        .delete-btn { background: #555; width: auto; padding: 5px 15px; font-size: 14px; margin: 0;}
        .delete-btn:hover { background: red; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8, 9, 13, 0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: #15161d; padding: 30px; border-radius: 15px; border: 1px solid #ff304b; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 0 20px rgba(255, 48, 75, 0.2); }
        .login-box h2 { color: #ff304b; margin-top: 0; margin-bottom: 20px; font-size: 24px; }
        
        .pass-wrapper { position: relative; width: 100%; margin-bottom: 10px; }
        .pass-wrapper input { padding-left: 50px; text-align: center; font-size: 18px; margin: 0; height: 45px;}
        
        .eye-btn { position: absolute; left: 5px; top: 5px; bottom: 5px; width: 40px; background: transparent; border: none; color: #9a9ba8; font-size: 20px; cursor: pointer; padding: 0; margin: 0; display: flex; justify-content: center; align-items: center;}
        .eye-btn:hover { background: rgba(255,255,255,0.05); }
        .error-msg { background: #ff304b; color: white; font-size: 14px; padding: 10px; border-radius: 8px; margin-top: 15px; display: none; font-weight: bold;}
    </style>
</head>
<body>

    <div id="loginModal" class="modal-overlay">
        <div class="login-box">
            <h2>👑 لوحة تحكم المدير</h2>
            <p style="color:#9a9ba8; margin-bottom:15px;">أدخل كلمة المرور للدخول</p>
            
            <div class="pass-wrapper">
                <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور" autocomplete="off">
                <button type="button" class="eye-btn" id="eyeToggle">👁️</button>
            </div>
            
            <p id="loginError" class="error-msg">كلمة المرور خاطئة!</p>
            <button id="loginBtn">دخول</button>
        </div>
    </div>

    <div class="container" id="adminContent">
        <h1>لوحة تحكم المدير</h1>
        
        <h3>إضافة كورس جديد</h3>
        <input type="text" id="courseTitle" placeholder="اسم الكورس (مثال: أساسيات الأمن)">
        <textarea id="courseDesc" placeholder="وصف الكورس" rows="3"></textarea>
        <select id="courseLevel">
            <option value="مبتدئ">مبتدئ</option>
            <option value="متوسط">متوسط</option>
            <option value="متقدم">متقدم</option>
        </select>
        <button id="addCourseBtn">إضافة الكورس للموقع</button>

        <hr style="border-color: #282a34; margin: 30px 0;">
        
        <h3>الكورسات المضافة حالياً (في هذا المتصفح)</h3>
        <div id="courseList"></div>
    </div>

    <script>
        // --- 1. دوال إظهار/إخفاء الباسورد ---
        document.getElementById('eyeToggle').addEventListener('click', function() {
            let input = document.getElementById('adminPassword');
            if (input.type === "password") {
                input.type = "text";
                this.innerHTML = "🙈";
            } else {
                input.type = "password";
                this.innerHTML = "👁️";
            }
        });

        // --- 2. دالة تسجيل الدخول ---
        document.getElementById('loginBtn').addEventListener('click', function() {
            let pass = document.getElementById('adminPassword').value;
            
            // مسح المسافات الزايدة
            pass = pass.trim(); 

            if (pass === "MinaAdmin2026") {
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                renderAdminList(); 
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });

        // --- 3. دوال إدارة الكورسات ---
        let localCourses = [];
        try {
            localCourses = JSON.parse(localStorage.getItem('customCourses')) || [];
        } catch(e) {
            console.log("Local storage error");
        }

        function renderAdminList() {
            let list = document.getElementById('courseList');
            if(!list) return;
            list.innerHTML = '';
            if(localCourses.length === 0) {
                list.innerHTML = '<p style="color:#777;">لا توجد كورسات مضافة حتى الآن.</p>';
                return;
            }
            localCourses.forEach((course, index) => {
                list.innerHTML += `
                    <div class="course-item">
                        <div>
                            <strong style="color:#ff304b;">${course.title}</strong> <br>
                            <small style="color:#9a9ba8;">${course.level} - ${course.desc}</small>
                        </div>
                        <button class="delete-btn" onclick="deleteCourse(${index})">حذف</button>
                    </div>
                `;
            });
        }

        document.getElementById('addCourseBtn').addEventListener('click', function() {
            let title = document.getElementById('courseTitle').value;
            let desc = document.getElementById('courseDesc').value;
            let level = document.getElementById('courseLevel').value;

            if (!title || !desc) {
                alert("يرجى ملء جميع الحقول!");
                return;
            }

            let newCourse = {
                id: "custom-" + Date.now(),
                title: title,
                desc: desc,
                level: level,
                pathId: "basics"
            };

            localCourses.push(newCourse);
            localStorage.setItem('customCourses', JSON.stringify(localCourses));
            
            document.getElementById('courseTitle').value = '';
            document.getElementById('courseDesc').value = '';
            
            renderAdminList();
            alert("تم إضافة الكورس بنجاح!");
        });

        function deleteCourse(index) {
            if(confirm("هل أنت متأكد من حذف هذا الكورس؟")) {
                localCourses.splice(index, 1);
                localStorage.setItem('customCourses', JSON.stringify(localCourses));
                renderAdminList();
            }
        }
    </script>
</body>
</html>
