<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>لوحة تحكم المدير | Cyber Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #08090d; color: white; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #15161d; padding: 25px; border-radius: 15px; border: 1px solid #282a34; }
        h1 { color: #ff304b; text-align: center; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #101116; border: 1px solid #282a34; color: white; border-radius: 8px; font-family: inherit; box-sizing: border-box;}
        button { background: #ff304b; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-top: 10px;}
        button:hover { background: #b90e2a; }
        .course-item { background: #101116; border: 1px solid #282a34; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;}
        .delete-btn { background: #555; width: auto; padding: 5px 15px; font-size: 14px; margin: 0;}
        .delete-btn:hover { background: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👑 لوحة تحكم المدير</h1>
        
        <h3>إضافة كورس جديد</h3>
        <input type="text" id="courseTitle" placeholder="اسم الكورس (مثال: أساسيات الأمن)">
        <textarea id="courseDesc" placeholder="وصف الكورس" rows="3"></textarea>
        <select id="courseLevel">
            <option value="مبتدئ">مبتدئ</option>
            <option value="متوسط">متوسط</option>
            <option value="متقدم">متقدم</option>
        </select>
        <button onclick="addCourse()">إضافة الكورس للموقع</button>

        <hr style="border-color: #282a34; margin: 30px 0;">
        
        <h3>الكورسات المضافة حالياً (في هذا المتصفح)</h3>
        <div id="courseList"></div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
