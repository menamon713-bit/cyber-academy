<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Cyber Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #08090d; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-box { background: #15161d; padding: 30px; border-radius: 15px; border: 1px solid #282a34; width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #ff304b; margin-bottom: 20px; }
        .input-group { position: relative; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; padding-left: 40px; background: #101116; border: 1px solid #282a34; color: white; border-radius: 8px; font-family: inherit; box-sizing: border-box; font-size: 16px; }
        input:focus { outline: none; border-color: #ff304b; }
        .eye-btn { position: absolute; left: 5px; top: 5px; bottom: 5px; width: 35px; background: transparent; border: none; color: #9a9ba8; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .primary-btn { background: #ff304b; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-top: 10px; }
        .primary-btn:hover { background: #b90e2a; }
        .link { color: #9a9ba8; font-size: 14px; text-decoration: none; display: block; margin-top: 15px; }
        .link:hover { color: white; }
    </style>
</head>
<body>

    <div class="auth-box">
        <h2>👑 تسجيل الدخول</h2>
        
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="كلمة المرور" required>
                <button type="button" class="eye-btn" id="eyeToggle">👁️</button>
            </div>
            
            <button type="submit" class="primary-btn" id="loginBtn">دخول</button>
        </form>

        <a href="/index.html" class="link">← العودة للصفحة الرئيسية</a>
    </div>

    <script src="auth.js"></script>
</body>
</html>
