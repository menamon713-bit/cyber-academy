<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>تسجيل الدخول | Cyber Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #08090d; color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;}
        .auth-container { background: #15161d; border: 1px solid #282a34; border-radius: 15px; padding: 30px; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ff304b; margin-bottom: 20px; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #282a34; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #9a9ba8; font-weight: bold;}
        .tab.active { color: #ff304b; border-bottom: 2px solid #ff304b; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #101116; border: 1px solid #282a34; color: white; border-radius: 8px; box-sizing: border-box; font-family: inherit;}
        button { width: 100%; background: #ff304b; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 15px;}
        button:hover { background: #b90e2a; }
        .msg { text-align: center; font-size: 14px; margin-top: 15px; display: none; padding: 10px; border-radius: 8px;}
        .msg.error { background: rgba(255, 48, 75, 0.2); color: #ff304b; display: block; }
        .msg.success { background: rgba(69, 212, 131, 0.2); color: #45d483; display: block; }
        .hidden { display: none; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #9a9ba8; text-decoration: none; font-size: 14px;}
        
        /* تنسيق زرار العين */
        .pass-wrapper { position: relative; }
        .pass-wrapper input { padding-left: 40px; }
        .eye-btn { position: absolute; left: 5px; top: 8px; background: transparent; border: none; color: #9a9ba8; cursor: pointer; width: auto; margin: 0; padding: 5px; font-size: 18px;}
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="tabs">
            <div class="tab active" id="loginTab">تسجيل الدخول</div>
            <div class="tab" id="registerTab">حساب جديد</div>
        </div>

        <!-- فورم تسجيل الدخول -->
        <div id="loginForm">
            <h2>أهلاً بعودتك 👋</h2>
            <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
            
            <div class="pass-wrapper">
                <input type="password" id="loginPassword" placeholder="كلمة المرور">
                <button type="button" class="eye-btn" id="eyeLogin">👁️</button>
            </div>
            
            <button id="loginBtn">دخول</button>
            <div style="text-align: center; margin-top: 10px;">
                <a href="#" id="forgotPassLink" style="color: #ff304b; font-size: 13px; text-decoration: none;">نسيت كلمة المرور؟</a>
            </div>
        </div>

        <!-- فورم إنشاء حساب -->
        <div id="registerForm" class="hidden">
            <h2>إنشاء حساب جديد 🚀</h2>
            <input type="text" id="regUsername" placeholder="اسم المستخدم">
            <input type="email" id="regEmail" placeholder="البريد الإلكتروني">
            
            <div class="pass-wrapper">
                <input type="password" id="regPassword" placeholder="كلمة المرور">
                <button type="button" class="eye-btn" id="eyeReg">👁️</button>
            </div>
            
            <button id="registerBtn">إنشاء الحساب</button>
        </div>

        <!-- فورم استعادة كلمة المرور -->
        <div id="resetForm" class="hidden">
            <h2>استعادة الحساب 🔐</h2>
            <input type="email" id="resetEmail" placeholder="البريد الإلكتروني المسجل">
            
            <div class="pass-wrapper">
                <input type="password" id="resetNewPassword" placeholder="كلمة المرور الجديدة">
                <button type="button" class="eye-btn" id="eyeReset">👁️</button>
            </div>
            
            <button id="resetBtn">تغيير كلمة المرور</button>
            <div style="text-align: center; margin-top: 10px;">
                <a href="#" id="backToLoginLink" style="color: #9a9ba8; font-size: 13px; text-decoration: none;">العودة لتسجيل الدخول</a>
            </div>
        </div>

        <div id="msgBox" class="msg"></div>
        <a href="/" class="back-link">← العودة للصفحة الرئيسية</a>
    </div>

    <script src="auth.js"></script>
</body>
</html>
