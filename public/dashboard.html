<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Academy - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // حماية الصفحة
        if (!localStorage.getItem('token')) {
            window.location.href = '/login.html';
        }
    </script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">
    <header class="max-w-6xl mx-auto mb-8 border-b border-gray-700 pb-4 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-green-400 font-mono">> Cyber Academy_</h1>
            <p class="text-gray-400">Welcome to your dashboard</p>
        </div>
        <div class="space-x-4">
            <a href="/admin.html" id="admin-btn" class="hidden bg-gray-800 hover:bg-gray-700 text-green-400 px-4 py-2 rounded-lg border border-gray-600 transition">Admin Panel</a>
            <button onclick="localStorage.clear(); window.location.href='/login.html';" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-4 py-2 rounded-lg border border-red-900 transition">Logout</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto">
        <h2 class="text-2xl font-semibold mb-6">Available Courses</h2>
        <div id="courses-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="text-gray-400 animate-pulse">Loading courses...</p>
        </div>
    </main>

    <script>
        // إظهار زرار الأدمن لو المستخدم أدمن
        if (localStorage.getItem('role') === 'admin') {
            document.getElementById('admin-btn').classList.remove('hidden');
        }
    </script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
