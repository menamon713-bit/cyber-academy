<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Academy | الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #08090d; color: white; margin: 0; padding: 0; }
        .navbar { background: #15161d; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #282a34; }
        .navbar h1 { margin: 0; color: #ff304b; font-size: 24px; }
        .nav-btn { background: #ff304b; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; }
        .hero { text-align: center; padding: 60px 20px; background: linear-gradient(180deg, #15161d 0%, #08090d 100%); }
        .hero h2 { font-size: 40px; color: #ff304b; margin-bottom: 10px; }
        .hero p { color: #9a9ba8; font-size: 18px; max-width: 600px; margin: 0 auto 30px; line-height: 1.6; }
        .hero-btns { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .btn-primary { background: #ff304b; color: white; padding: 15px 30px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 18px; border: none; cursor: pointer; }
        .btn-secondary { background: #282a34; color: white; padding: 15px 30px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 18px; border: none; cursor: pointer; }
        .stats-section { display: flex; justify-content: center; gap: 20px; padding: 40px 20px; flex-wrap: wrap; }
        .stat-box { background: #15161d; border: 1px solid #282a34; padding: 20px 40px; border-radius: 12px; text-align: center; min-width: 150px; }
        .stat-box h3 { margin: 0; font-size: 36px; color: #45d483; }
        .stat-box p { margin: 5px 0 0; color: #9a9ba8; }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>_CyberAcademy</h1>
        <!-- الزرار ده هيفتح صفحة تسجيل الدخول -->
        <a href="/auth.html" class="nav-btn">تسجيل الدخول</a>
    </nav>

    <section class="hero">
        <h2>أهلاً بك في أكاديمية سايبر</h2>
        <p>تعلم الأمن السيبراني خطوة بخطوة، تدرب على أحدث التقنيات، وابنِ مستقبلك في مجال حماية الأنظمة والشبكات.</p>
        
        <div class="hero-btns">
            <!-- الزرار ده هيفتح صفحة الكورسات -->
            <button class="btn-secondary" onclick="window.location.href='/course.html'">ابدأ الكورسات</button>
            <button class="btn-primary" onclick="window.location.href='/auth.html'">ابدأ رحلة التعلم</button>
        </div>
    </section>

    <section class="stats-section">
        <div class="stat-box">
            <h3 style="color: #3b82f6;">12+</h3>
            <p>إجمالي الكورسات</p>
        </div>
        <div class="stat-box">
            <h3 style="color: #45d483;">36+</h3>
            <p>درس تفاعلي</p>
        </div>
        <div class="stat-box">
            <h3 style="color: #a855f7;">100%</h3>
            <p>محتوى مجاني</p>
        </div>
    </section>

</body>
</html>
