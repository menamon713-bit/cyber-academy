<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - Cyber Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center font-sans">
    <div class="bg-gray-800 p-8 rounded-xl border border-gray-700 w-full max-w-md shadow-2xl">
        <h2 class="text-3xl font-bold text-red-500 text-center mb-6 font-mono">> تسجيل الدخول_</h2>
        
        <div id="error-msg" class="hidden text-red-400 bg-red-900/30 p-3 rounded mb-4 text-sm text-center"></div>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm mb-1 text-gray-300">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 focus:border-red-400 outline-none">
            </div>
            <div>
                <label class="block text-sm mb-1 text-gray-300">كلمة المرور</label>
                <div class="relative">
                    <!-- ضفنا pl-10 عشان نعمل مساحة لزرار العين -->
                    <input type="password" id="password" required class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 pl-10 focus:border-red-400 outline-none">
                    <!-- زرار العين -->
                    <button type="button" onclick="togglePassword('password', 'eye-icon-login')" class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 hover:text-white">
                        <svg id="eye-icon-login" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full bg-red-600 hover:bg-red-500 font-bold py-2 rounded transition text-white">دخول</button>
        </form>
        <p class="text-center text-sm text-gray-400 mt-4">مفيش حساب؟ <a href="/register.html" class="text-red-400 hover:underline">سجل جديد</a></p>
    </div>
    
    <script src="/js/auth.js"></script>
</body>
</html>
