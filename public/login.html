<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyber Academy - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
    <div class="bg-gray-800 p-8 rounded-xl border border-gray-700 w-full max-w-md shadow-2xl">
        <h2 class="text-3xl font-bold text-green-400 text-center mb-6 font-mono">> Login_</h2>
        <div id="error-msg" class="hidden text-red-400 bg-red-900/30 p-3 rounded mb-4 text-sm"></div>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm mb-1 text-gray-300">Email</label>
                <input type="email" id="email" required class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 focus:border-green-400 outline-none">
            </div>
            <div>
                <label class="block text-sm mb-1 text-gray-300">Password</label>
                <input type="password" id="password" required class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 focus:border-green-400 outline-none">
            </div>
            <button type="submit" class="w-full bg-green-600 hover:bg-green-500 font-bold py-2 rounded transition">Login</button>
        </form>
        <p class="text-center text-sm text-gray-400 mt-4">Don't have an account? <a href="/register.html" class="text-green-400 hover:underline">Register</a></p>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                // تم تغيير اللينك هنا
                const res = await fetch('https://trailers-suzuki-mean-aug.trycloudflare.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);
                    window.location.href = '/dashboard.html';
                } else {
                    errorMsg.textContent = data.error;
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = "Network error. Make sure Termux is running.";
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
